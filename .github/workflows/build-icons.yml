name: Build PWA icons
on:
  push:
    branches: [main]
    paths: ['assets/logo.svg', 'scripts/generate_icons.py', '.github/workflows/build-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==11.3.0'
      - run: python scripts/generate_icons.py
      - name: Commit PNG icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png
          if ! git diff --cached --quiet; then git commit -m 'Generate PWA PNG icons'; git push; fi
